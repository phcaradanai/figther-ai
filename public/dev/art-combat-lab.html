    #presetDrawer h2 { font-size: 13px; color: #f3ce88; }

    #presetJson {

    #bottombar {
      position: fixed;
      left: 8px;

  <script src="/js/shared_data.js"></script>
  <script src="/js/effekseer_knight_bridge.js"></script>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { Stage } from '/js/three/stage.js';
    import { ChibiView } from '/js/three/chibi.js';
    import { FxSystem } from '/js/three/fx.js';
    import { KnightThreeVFX } from '/js/three/knight_effekseer_3d.js';
    import { makeShadowTexture } from '/js/three/textures.js';
    import { createToneMaterialSet, ToneOutlinePass } from '/dev/art_tone_shader.js';
    import { PRESETS, PRESET_ORDER, PRESET_REVISION } from '/dev/art_combat_presets.js';
    import { DUEL_CAMERA, SCENARIOS, SCENARIO_ORDER } from '/dev/art_combat_scenarios.js';

    const DT = 1 / 60;
    const COS45 = Math.SQRT1_2;

    // Deterministic simulation clock & seeded RNG so replay, scrubbing, and A/B/C passes match 1:1.
    const realRandom = Math.random.bind(Math);
    let simNowMs = 1000;
    let rngState = 1337;
    function mulberry32() {
      rngState = (rngState + 0x6D2B79F5) >>> 0;
      let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    performance.now = () => simNowMs;

    const canvas = document.getElementById('view');
    const overlay = document.getElementById('overlay');
    const octx = overlay.getContext('2d');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    renderer.setPixelRatio(dpr);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 1.02;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    const roomEnv = new RoomEnvironment();
    const envRT = pmrem.fromScene(roomEnv, 0.04);
    scene.environment = envRT.texture;
    scene.environmentIntensity = 0.72;
    roomEnv.dispose();
    pmrem.dispose();

    const hemi = new THREE.HemisphereLight('#fff5e0', '#a7bfd9', 1.0);
    const sun = new THREE.DirectionalLight('#fff0d4', 1.7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 75 });
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.03;
    scene.add(hemi, sun, sun.target);

    const camera = new THREE.PerspectiveCamera(DUEL_CAMERA.fov, 1, 0.5, 300);

    // Real Sky Temple stage + cached original material colors for non-destructive preset tinting
    const stage = new Stage(GAME_DATA.MAPS[DUEL_CAMERA.mapId]);
    scene.add(stage.group);
    stage.applyEnvironment(scene, hemi, sun);
    if (scene.fog?.isFog) {
      scene.fog.near += 11;
      scene.fog.far += 15;
    }
    const stageColorRecords = [];
    {
      const seenMat = new Set();
      stage.group.traverse((obj) => {
        if (!obj.isMesh || !obj.material) return;
        const isPlatform = obj.name === 'sanctuary_court' || obj.parent?.name === 'sanctuary_court';
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        for (const m of mats) {
          if (!m.color || seenMat.has(m)) continue;
          seenMat.add(m);
          stageColorRecords.push({ mat: m, origColor: m.color.clone(), isPlatform });
        }
      });
    }

    // Contact shadows, target rings, and guard dome matching renderer3d.js
    const shadowTex = makeShadowTexture();
    function makeShadowDecal() {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(1.4, 1.4),
        new THREE.MeshBasicMaterial({ map: shadowTex, color: '#ffffff', transparent: true, depthWrite: false })
      );
      m.rotation.x = -Math.PI / 2;
      m.renderOrder = 2;
      scene.add(m);
      return m;
    }
    function makeRingDecal(color) {
      const m = new THREE.Mesh(
        new THREE.RingGeometry(0.56, 0.63, 36),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.42, depthWrite: false, side: THREE.DoubleSide })
      );
      m.rotation.x = -Math.PI / 2;
      m.renderOrder = 3;
      scene.add(m);
      return m;
    }
    const knightShadow = makeShadowDecal();
    const ninjaShadow = makeShadowDecal();
    const knightRing = makeRingDecal('#d4a349');
    const ninjaRing = makeRingDecal('#f87171');
    const guardDome = new THREE.Mesh(
      new THREE.SphereGeometry(1.0, 22, 12, Math.PI / 2 - 1.1, 2.2, 0.35, 2.2),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color('#60a5fa').multiplyScalar(1.4),
        transparent: true,
        opacity: 0.22,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    guardDome.visible = false;
    scene.add(guardDome);

    // Real game FX systems (FxSystem + KnightThreeVFX / KnightHolyVFX)
    let shake = 0;
    let punch = 0;
    const fx = new FxSystem(scene);
    fx.ctx = {
      shake: (a) => { shake = Math.min(1.4, Math.max(shake, a * 0.07)); },
      floorY: (x, z, y) => stage.floorY(x, z, y)
    };
    const knightVfx = new KnightThreeVFX(scene, camera, fx.ctx.shake, fx.ctx.floorY);

    let knight = null;
    let ninja = null;
    let knightView = null;
    let ninjaView = null;
    let knightToneSet = null;
    const outlinePass = new ToneOutlinePass();

    knightVfx.attachHoly({
      fx,
      getProjectiles: () => new Map(),
      hitStop: (id, ms) => {
        if (id === 'knight') knightView?.hitStop(ms);
        else if (id === 'ninja') ninjaView?.hitStop(ms);
      },
      punch: (a) => { punch = Math.min(2, Math.max(punch, a)); }
    });

    const labState = {
      viewMode: 'triptych', // 'triptych' | 'A' | 'B' | 'C'
      scenarioId: 'hit',
      inspectPresetId: 'C',
      camDist: DUEL_CAMERA.camDist,
      paused: false,
      simTime: 0,
      swingTriggered: false,
      ninjaStunUntil: 0,
      origFxAddCol: new Float32Array(fx.add.col.length),
      origSparkCount: 0,
      origSparkColors: new Float32Array(480 * 3)
    };

    const env = {
      dt: DT,
      fx,
      floorY: (x, z, y) => stage.floorY(x, z, y)
    };

    function makeFighter(id, heroId, name, start) {
      const hero = GAME_DATA.HEROES[heroId];
      return {
        id,
        name,
        heroId,
        gear: { weapon: heroId, armor: heroId, helmet: heroId, trinket: heroId },
        x: start.x,
        y: start.y,
        z: start.z,
        vx: 0,
        vy: 0,
        vz: 0,
        facing: start.facing,
        grounded: true,
        state: 'idle',
        comboStep: 0,
        guarding: false,
        hp: hero.maxHp,
        maxHp: hero.maxHp,
        jumpCount: 0,
        isSprinting: false,
        isRolling: false,
        isDashing: false,
        buffs: {}
      };
    }

    function clearVfx() {
      fx.clear();
      if (knightVfx.holy) {
        for (const e of knightVfx.holy.effects) knightVfx.holy.dispose(e.root);
        knightVfx.holy.effects.length = 0;
        knightVfx.holy.sparks.length = 0;
        knightVfx.holy.sparkMesh.count = 0;
        knightVfx.holy.swings.clear();
        knightVfx.holy.freezeUntil = 0;
      }
      shake = 0;
      punch = 0;
    }

    function resetScenario(id = labState.scenarioId) {
      labState.scenarioId = SCENARIOS[id] ? id : 'hit';
      const sc = SCENARIOS[labState.scenarioId];

      simNowMs = 1000;
      rngState = 1337;
      labState.simTime = 0;
      labState.swingTriggered = false;
      labState.ninjaStunUntil = 0;
      clearVfx();

      knightToneSet?.dispose();
      knightView?.dispose();
      ninjaView?.dispose();

      knight = makeFighter('knight', 'knight', 'Iron Knight', sc.knightStart);
      ninja = makeFighter('ninja', 'ninja', 'Shadow Ninja', sc.ninjaStart);
      if (sc.ninjaGuarding) {
        ninja.guarding = true;
        ninja.state = 'guard';
      }

      knightView = new ChibiView(knight);
      ninjaView = new ChibiView(ninja);
      knightView.time = 0;
      ninjaView.time = 0;
      scene.add(knightView.root, ninjaView.root);
      knightToneSet = createToneMaterialSet(knightView, PRESETS.B.knightTone);

      // Warm up 1 tick at t=0 so both fighters stand planted in their initial pose.
      stepSimulation(0);
    }

    function releaseCombatResult(heldEvents) {
      const sc = SCENARIOS[labState.scenarioId];
      for (const ev of heldEvents) {
        if (ev.type === 'hit') {
          ninja.hp = Math.max(0, ninja.hp - sc.damage);
          ninja.state = 'hurt';
          labState.ninjaStunUntil = labState.simTime + sc.stunSec;
          const dx = Math.cos(knight.facing);
          const dz = Math.sin(knight.facing);
          ninja.vx = dx * sc.knockback * 2.2;
          ninja.vz = dz * sc.knockback * 2.2;
          knightVfx.handleServerFx(ev);
          fx.handle(ev);
          ninjaView.onHit(false);
          ninjaView.hitStop(sc.ninjaHitStopMs);
          knightView.hitStop(sc.knightHitStopMs);
        } else if (ev.type === 'block') {
          ninja.hp = Math.max(1, ninja.hp - sc.chipDamage);
          const dx = Math.cos(knight.facing);
          const dz = Math.sin(knight.facing);
          ninja.vx = dx * sc.blockPush;
          ninja.vz = dz * sc.blockPush;
          fx.handle(ev);
          ninjaView.onBlock?.();
          ninjaView.hitStop(sc.ninjaHitStopMs);
          knightView.hitStop(sc.knightHitStopMs);
        }
      }
    }

    function stepSimulation(dt) {
      const prevRandom = Math.random;
      Math.random = mulberry32;
      try {
        const sc = SCENARIOS[labState.scenarioId];
        if (dt > 0) {
          simNowMs += dt * 1000;
          labState.simTime += dt;
        }

        // Trigger Knight's attack1 at swingAt (and queue blade-contact hit/block via real ChibiView)
        if (!labState.swingTriggered && labState.simTime >= sc.swingAt) {
          labState.swingTriggered = true;
          const dx = Math.cos(knight.facing);
          const dz = Math.sin(knight.facing);
          knight.state = 'attack';
          knight.comboStep = 1;
          knight.vx = dx * sc.lunge;
          knight.vz = dz * sc.lunge;

          const slashEvent = {
            id: 101,
            type: 'slash',
            x: knight.x + dx * 1.1,
            y: knight.y + 0.9,
            z: knight.z + dz * 1.1,
            facing: knight.facing,
            color: GAME_DATA.HEROES.knight.accentColor,
            heroId: 'knight',
            playerId: 'knight',
            originX: knight.x,
            originY: knight.y,
            originZ: knight.z,
            weaponType: 'broadsword',
            comboStep: 1,
            isFinisher: false
          };

          knightView.queueBladeAccent(
            slashEvent,
            (ev, held) => {
              if (!knightVfx.handleServerFx(ev)) fx.handle(ev);
              releaseCombatResult(held);
            },
            (held) => releaseCombatResult(held)
          );

          if (sc.outcome === 'hit') {
            knightView.holdForContact({
              id: 102,
              type: 'hit',
              attackerId: 'knight',
              x: ninja.x,
              y: ninja.y + 1.1,
              z: ninja.z,
              damage: sc.damage,
              color: '#f87171'
            });
          } else if (sc.outcome === 'block') {
            knightView.holdForContact({
              id: 103,
              type: 'block',
              attackerId: 'knight',
              playerId: 'ninja',
              heroId: 'ninja',
              x: ninja.x,
              y: ninja.y + 1.0,
              z: ninja.z,
              facing: ninja.facing,
              text: `BLOCK (-${sc.chipDamage})`,
              color: '#60a5fa'
            });
          }
        }

        // End Knight swing window after commit/attack1 duration
        if (labState.swingTriggered && labState.simTime >= sc.swingAt + 0.34 && knight.state === 'attack') {
          knight.state = 'idle';
          knight.comboStep = 0;
        }
        if (ninja.state === 'hurt' && labState.simTime >= labState.ninjaStunUntil) {
          ninja.state = sc.ninjaGuarding ? 'guard' : 'idle';
        }

        // Integrate grounded motion with exponential damping
        const damp = Math.exp(-dt * 9.5);
        for (const pl of [knight, ninja]) {
          pl.x += pl.vx * dt;
          pl.z += pl.vz * dt;
          pl.vx *= damp;
          pl.vz *= damp;
        }

        knightView.update(knight, { dt, fx, floorY: env.floorY });
        ninjaView.update(ninja, { dt, fx, floorY: env.floorY });

        // Update decals & guard dome
        for (const [pl, shadow, ring] of [[knight, knightShadow, knightRing], [ninja, ninjaShadow, ninjaRing]]) {
          const fy = stage.floorY(pl.x, pl.z, pl.y + 0.1) ?? 0;
          shadow.position.set(pl.x, fy + 0.024, pl.z);
          ring.position.set(pl.x, fy + 0.030, pl.z);
        }
        guardDome.visible = !!ninja.guarding;
        if (guardDome.visible) {
          guardDome.position.set(ninja.x, ninja.y + 0.95, ninja.z);
          guardDome.rotation.y = ninjaView.yaw;
        }

        // Advance FX systems and snapshot original particle/spark colors for A/B/C passes
        stage.update(labState.simTime, dt);
        fx.update(dt);
        knightVfx.update(dt, null);
        shake *= Math.exp(-dt * 9);
        punch *= Math.exp(-dt * 12);

        labState.origFxAddCol.set(fx.add.col);
        if (knightVfx.holy) {
          const sm = knightVfx.holy.sparkMesh;
          labState.origSparkCount = sm.count;
          if (sm.count > 0 && sm.instanceColor) {
            labState.origSparkColors.set(sm.instanceColor.array.subarray(0, sm.count * 3));
          }
        }
      } finally {
        Math.random = prevRandom;
      }
    }

    function seek(targetTime) {
      const sc = SCENARIOS[labState.scenarioId];
      const t = THREE.MathUtils.clamp(targetTime, 0, sc.length);
      if (t < labState.simTime - 1e-6) resetScenario(labState.scenarioId);
      while (labState.simTime + DT / 2 < t) stepSimulation(DT);
      updateTimelineUI();
    }

    // Visual-only preset application for each render pass (never alters simulation state)
    const _colTmp = new THREE.Color();
    const _tintTmp = new THREE.Color();
    function applyVfxPreset(preset) {
      const sc = SCENARIOS[labState.scenarioId];
      const isBlock = sc.outcome === 'block';
      const vfxCfg = preset.vfx;

      // 1. Knight 3D SwordTrail vertex RGB
      if (knightView?.swordTrail?.geo) {
        const colAttr = knightView.swordTrail.geo.attributes.color;
        const arr = colAttr.array;
        const { root, mid, edge } = vfxCfg.swordTrail;
        const n = knightView.swordTrail.samples.length * 3;
        for (let i = 0; i < n; i++) {
          const ci = i * 4;
          const row = i % 3;
          const rgb = row === 0 ? root : (row === 1 ? mid : edge);
          arr[ci] = rgb[0];
          arr[ci + 1] = rgb[1];
          arr[ci + 2] = rgb[2];
        }
        colAttr.needsUpdate = true;
      }

      // 2. Guard dome
      if (guardDome.visible) {
        guardDome.material.color.set(vfxCfg.block.shield).multiplyScalar(1.4);
        guardDome.material.opacity = (vfxCfg.block.shieldOpacity ?? 0.22) + Math.sin(labState.simTime * 8) * 0.04;
        guardDome.scale.setScalar(vfxCfg.recolor ? vfxCfg.block.scale : 1.0);
      }

      // 3. FxSystem additive particles (e.g., Ninja block flash/sparks)
      const addArr = fx.add.col;
      if (!vfxCfg.recolor) {
        addArr.set(labState.origFxAddCol);
      } else {
        const targetHex = isBlock ? vfxCfg.block.flash : vfxCfg.hit.accent;
        _tintTmp.set(targetHex);
        for (let i = 0; i < fx.add.max; i++) {
          if (fx.add.life[i] <= 0) continue;
          const j = i * 3;
          const luma = Math.max(0.45, (labState.origFxAddCol[j] + labState.origFxAddCol[j + 1] + labState.origFxAddCol[j + 2]) / 3);
          addArr[j] = _tintTmp.r * luma;
          addArr[j + 1] = _tintTmp.g * luma;
          addArr[j + 2] = _tintTmp.b * luma;
        }
      }
      fx.add.geometry.attributes.pcolor.needsUpdate = true;

      // 4. KnightHolyVFX impact bursts, hit lines & spark needles
      const holy = knightVfx.holy;
      if (!holy) return;
      const sm = holy.sparkMesh;
      if (sm.count > 0 && sm.instanceColor) {
        const sArr = sm.instanceColor.array;
        if (!vfxCfg.recolor) {
          sArr.set(labState.origSparkColors.subarray(0, sm.count * 3));
        } else {
          _tintTmp.set(isBlock ? vfxCfg.block.spark : vfxCfg.hit.spark);
          for (let i = 0; i < sm.count; i++) {
            const j = i * 3;
            const luma = (labState.origSparkColors[j] + labState.origSparkColors[j + 1] + labState.origSparkColors[j + 2]) / 3;
            sArr[j] = _tintTmp.r * luma * 1.15;
            sArr[j + 1] = _tintTmp.g * luma * 1.15;
            sArr[j + 2] = _tintTmp.b * luma * 1.15;
          }
        }
        sm.instanceColor.needsUpdate = true;
      }

      for (const e of holy.effects) {
        if (e.root.userData.origScale === undefined) {
          e.root.userData.origScale = e.root.scale.x;
        }
        const scaleMul = !vfxCfg.recolor ? 1.0 : (isBlock ? vfxCfg.block.scale : vfxCfg.hit.scale);
        e.root.scale.setScalar(e.root.userData.origScale * scaleMul);

        e.root.traverse((obj) => {
          const mat = obj.material;
          if (!mat || !mat.color) return;
          if (!mat.userData.origColor) mat.userData.origColor = mat.color.clone();
          const orig = mat.userData.origColor;
          if (!vfxCfg.recolor) {
            mat.color.copy(orig);
            return;
          }
          const luma = orig.r * 0.299 + orig.g * 0.587 + orig.b * 0.114;
          if (luma < 0.15) {
            mat.color.set(vfxCfg.hit.outline);
          } else if (orig.r > 0.95 && orig.g > 0.92 && orig.b > 0.85) {
            mat.color.set(isBlock ? vfxCfg.block.spark : vfxCfg.hit.hot);
            if (mat.blending === THREE.AdditiveBlending) mat.color.multiplyScalar(1.45);
          } else {
            mat.color.set(isBlock ? vfxCfg.block.ring : vfxCfg.hit.body);
          }
        });
      }
    }

    function applyPresetForPass(preset) {
      // Stage tint & exposure
      _colTmp.set(preset.stage.floorTint);
      _tintTmp.set(preset.stage.propTint);
      for (const r of stageColorRecords) {
        r.mat.color.copy(r.origColor).multiply(r.isPlatform ? _colTmp : _tintTmp);
      }
      if (scene.fog?.isFog) scene.fog.color.set(preset.stage.fogColor);
      scene.environmentIntensity = preset.stage.envIntensity;
      renderer.toneMappingExposure = preset.stage.exposure;

      // Lights
      hemi.color.set(preset.lighting.hemiSky);
      hemi.groundColor.set(preset.lighting.hemiGround);
      hemi.intensity = preset.lighting.hemiIntensity;
      sun.color.set(preset.lighting.sunColor);
      sun.intensity = preset.lighting.sunIntensity;

      // Ground shadows & rings
      const gs = preset.groundShadow;
      for (const sh of [knightShadow, ninjaShadow]) {
        sh.material.color.set(gs.color);
        sh.scale.setScalar(gs.scale);
        sh.material.opacity = gs.opacity;
      }
      knightRing.material.color.set(gs.knightRingColor);
      knightRing.material.opacity = gs.ringOpacity;
      ninjaRing.material.color.set(gs.ninjaRingColor);
      ninjaRing.material.opacity = gs.ringOpacity;

      // Knight tone
      if (preset.knightTone) knightToneSet.applyTone(preset.knightTone);
      else knightToneSet.applyOriginal();

      // FX colors
      applyVfxPreset(preset);
    }

    function updateCamera(aspect) {
      const [tx, ty, tz] = DUEL_CAMERA.target;
      const effDist = labState.camDist * (1 - 0.045 * punch);
      const horiz = effDist * Math.cos(DUEL_CAMERA.pitch);
      const vert = effDist * Math.sin(DUEL_CAMERA.pitch);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
      camera.position.set(tx + horiz * COS45, ty + vert, tz + horiz * COS45);
      camera.lookAt(tx, ty, tz);
      sun.position.set(tx - 12, ty + 24, tz + 5);
      sun.target.position.set(tx, ty, tz);
      sun.target.updateMatrixWorld();
    }

    const _proj = new THREE.Vector3();
    function projectToViewport(wx, wy, wz, vx, vw, h) {
      _proj.set(wx, wy, wz).project(camera);
      if (_proj.z > 1) return null;
      return {
        x: vx + (_proj.x + 1) * 0.5 * vw,
        y: (1 - _proj.y) * 0.5 * h
      };
    }

    function drawOverlayForPass(vx, vw, h, preset) {
      octx.save();
      octx.beginPath();
      octx.rect(vx, 0, vw, h);
      octx.clip();
      octx.textAlign = 'center';
      octx.lineJoin = 'round';
      const font = (px) => `800 ${px}px "Segoe UI", Tahoma, sans-serif`;

      for (const [pl, isKnight] of [[knight, true], [ninja, false]]) {
        const s = projectToViewport(pl.x, pl.y + 2.25, pl.z, vx, vw, h);
        if (!s) continue;
        octx.font = font(11);
        octx.lineWidth = 3.2;
        octx.strokeStyle = 'rgba(30,18,12,0.85)';
        octx.strokeText(pl.name, s.x, s.y);
        octx.fillStyle = isKnight ? '#fde68a' : '#fca5a5';
        octx.fillText(pl.name, s.x, s.y);

        const barW = 46, barH = 5;
        const pct = Math.max(0, Math.min(1, pl.hp / pl.maxHp));
        octx.fillStyle = 'rgba(20,12,8,0.75)';
        octx.fillRect(s.x - barW / 2 - 1, s.y + 4, barW + 2, barH + 2);
        octx.fillStyle = pct > 0.5 ? '#4ade80' : pct > 0.25 ? '#facc15' : '#f87171';
        octx.fillRect(s.x - barW / 2, s.y + 5, barW * pct, barH);
      }

      for (const t of fx.texts) {
        const k = (simNowMs - t.born) / t.ttl;
        if (k < 0 || k >= 1) continue;
        const rise = t.kind === 'dmg' ? 0.9 * (1 - Math.pow(1 - k, 2)) : 0.7 * k;
        const s = projectToViewport(t.x + (t.kind === 'dmg' ? t.jitter : 0), t.y + rise, t.z, vx, vw, h);
        if (!s) continue;
        const pop = t.kind === 'dmg' ? (k < 0.12 ? 1.65 - (k / 0.12) * 0.65 : 1) : 1;
        const alpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
        const px = (t.kind === 'dmg' ? 24 : 15) * pop;
        octx.globalAlpha = alpha;
        octx.font = font(px);
        octx.lineWidth = t.kind === 'dmg' ? 4.5 : 3.5;
        octx.strokeStyle = 'rgba(40,16,8,0.9)';
        octx.strokeText(t.text, s.x, s.y);
        const fillColor = t.kind === 'dmg'
          ? preset.vfx.hit.damageText
          : (t.text.startsWith('BLOCK') ? preset.vfx.block.text : t.color);
        octx.fillStyle = fillColor;
        octx.fillText(t.text, s.x, s.y);
        octx.globalAlpha = 1;
      }
      octx.restore();
    }

    function renderPass(vx, vy, vw, vh, preset) {
      updateCamera(vw / Math.max(1, vh));
      renderer.setViewport(vx, vy, vw, vh);
      renderer.setScissorTest(true);
      renderer.setScissor(vx, vy, vw, vh);

      applyPresetForPass(preset);
      renderer.clear(true, true, false);
      renderer.render(scene, camera);

      if (preset.knightTone) {
        outlinePass.render(renderer, scene, camera, {
          stageGroup: stage.group,
          knightRoot: knightView.root,
          hiddenDuringMask: [
            ninjaView.root,
            knightShadow, ninjaShadow, knightRing, ninjaRing, guardDome,
            fx.group, fx.add.points, fx.norm.points,
            knightVfx.group, knightVfx.holy?.group,
            knightView.swordTrail?.mesh
          ],
          vx, vy, vw, vh,
          dpr: renderer.getPixelRatio(),
          params: preset.knightTone
        });
      }

      drawOverlayForPass(vx, vw, vh, preset);
    }

    function renderFrame() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      octx.clearRect(0, 0, w, h);
      renderer.autoClear = false;
      renderer.setRenderTarget(null);

      if (labState.viewMode === 'triptych') {
        const w1 = Math.floor(w / 3);
        const w2 = Math.floor((w * 2) / 3) - w1;
        const w3 = w - w1 - w2;
        renderPass(0, 0, w1, h, PRESETS.A);
        renderPass(w1, 0, w2, h, PRESETS.B);
        renderPass(w1 + w2, 0, w3, h, PRESETS.C);
      } else {
        renderPass(0, 0, w, h, PRESETS[labState.viewMode]);
      }

      updateTimelineUI();
    }

    function updateTimelineUI() {
      const sc = SCENARIOS[labState.scenarioId];
      const scrub = document.getElementById('scrub');
      scrub.max = sc.length;
      scrub.value = labState.simTime;
      document.getElementById('timeLabel').textContent = `${labState.simTime.toFixed(2)} / ${sc.length.toFixed(2)}s`;
      document.getElementById('scenarioDesc').textContent = sc.desc;
      document.getElementById('status').textContent =
        `${labState.viewMode === 'triptych' ? 'A|B|C' : labState.viewMode} | ${labState.paused ? 'PAUSED' : 'PLAY'} | ` +
        `K=${knightView.currentName} N=${ninjaView.currentName} | Ninja HP=${ninja.hp}/${ninja.maxHp} | cam=${labState.camDist}`;
    }

    // UI wiring
    const viewButtons = {
      triptych: document.getElementById('viewTriptych'),
      A: document.getElementById('viewA'),
      B: document.getElementById('viewB'),
      C: document.getElementById('viewC')
    };
    const scenButtons = {
      hit: document.getElementById('scenHit'),
      block: document.getElementById('scenBlock'),
      miss: document.getElementById('scenMiss')
    };
    const badgeA = document.getElementById('badgeA');
    const badgeB = document.getElementById('badgeB');
    const badgeC = document.getElementById('badgeC');
    const div1 = document.getElementById('div1');
    const div2 = document.getElementById('div2');

    function setViewMode(mode) {
      labState.viewMode = mode;
      for (const [k, btn] of Object.entries(viewButtons)) btn.setAttribute('aria-pressed', String(k === mode));
      const tri = mode === 'triptych';
      div1.hidden = !tri;
      div2.hidden = !tri;
      if (tri) {
        badgeA.hidden = badgeB.hidden = badgeC.hidden = false;
        badgeA.style.left = '12px';
        badgeB.style.left = 'calc(33.3333% + 12px)';
        badgeC.style.left = 'calc(66.6667% + 12px)';
      } else {
        badgeA.hidden = mode !== 'A';
        badgeB.hidden = mode !== 'B';
        badgeC.hidden = mode !== 'C';
        badgeA.style.left = badgeB.style.left = badgeC.style.left = '12px';
      }
      if (mode !== 'triptych') setInspectPreset(mode);
    }

    function setScenario(id, { seekTo = null, autoPlay = true } = {}) {
      for (const [k, btn] of Object.entries(scenButtons)) btn.setAttribute('aria-pressed', String(k === id));
      resetScenario(id);
      if (seekTo !== null) {
        setPaused(true);
        seek(seekTo);
      } else if (autoPlay) {
        setPaused(false);
      }
    }

    function setPaused(paused) {
      labState.paused = !!paused;
      const btn = document.getElementById('playBtn');
      btn.setAttribute('aria-pressed', String(labState.paused));
      btn.textContent = labState.paused ? 'เล่นต่อ (P)' : 'หยุด (P)';
    }

    function setInspectPreset(id) {
      labState.inspectPresetId = PRESETS[id] ? id : 'C';
      const p = PRESETS[labState.inspectPresetId];
      for (const pid of PRESET_ORDER) {
        document.getElementById('inspect' + pid).setAttribute('aria-pressed', String(pid === labState.inspectPresetId));
      }
      document.getElementById('presetTitle').textContent = `${p.label}`;
      document.getElementById('presetSummary').textContent = p.summary;
      document.getElementById('presetJson').value = JSON.stringify(p, null, 2);
    }

    for (const [mode, btn] of Object.entries(viewButtons)) btn.onclick = () => setViewMode(mode);
    for (const [id, btn] of Object.entries(scenButtons)) btn.onclick = () => setScenario(id);
    for (const pid of PRESET_ORDER) document.getElementById('inspect' + pid).onclick = () => setInspectPreset(pid);

    document.getElementById('camSel').onchange = (e) => { labState.camDist = Number(e.target.value); };
    document.getElementById('inspectBtn').onclick = (e) => {
      const drawer = document.getElementById('presetDrawer');
      drawer.hidden = !drawer.hidden;
      e.currentTarget.setAttribute('aria-pressed', String(!drawer.hidden));
    };
    document.getElementById('replayBtn').onclick = () => setScenario(labState.scenarioId, { autoPlay: true });
    document.getElementById('playBtn').onclick = () => setPaused(!labState.paused);
    document.getElementById('prevFrameBtn').onclick = () => {
      setPaused(true);
      seek(Math.max(0, labState.simTime - DT));
    };
    document.getElementById('nextFrameBtn').onclick = () => {
      setPaused(true);
      seek(labState.simTime + DT);
    };
    document.getElementById('jumpStandBtn').onclick = () => {
      setPaused(true);
      seek(SCENARIOS[labState.scenarioId].standTime);
    };
    document.getElementById('jumpContactBtn').onclick = () => {
      setPaused(true);
      seek(SCENARIOS[labState.scenarioId].inspectContactTime);
    };
    document.getElementById('scrub').addEventListener('input', (e) => {
      setPaused(true);
      seek(Number(e.target.value));
    });

    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Digit1') setViewMode('A');
      else if (e.code === 'Digit2') setViewMode('B');
      else if (e.code === 'Digit3') setViewMode('C');
      else if (e.code === 'Digit4') setViewMode('triptych');
      else if (e.code === 'KeyR') setScenario(labState.scenarioId, { autoPlay: true });
      else if (e.code === 'KeyP' || e.code === 'Space') { e.preventDefault(); setPaused(!labState.paused); }
      else if (e.code === 'Comma') { setPaused(true); seek(Math.max(0, labState.simTime - DT)); }
      else if (e.code === 'Period') { setPaused(true); seek(labState.simTime + DT); }
    });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h, false);
      const ovDpr = Math.min(window.devicePixelRatio || 1, 2);
      overlay.width = Math.floor(w * ovDpr);
      overlay.height = Math.floor(h * ovDpr);
      octx.setTransform(ovDpr, 0, 0, ovDpr, 0, 0);
      fx.setPixelScale((h * renderer.getPixelRatio()) / (2 * Math.tan(THREE.MathUtils.degToRad(DUEL_CAMERA.fov / 2))));
      const topBottom = document.getElementById('topbar').getBoundingClientRect().bottom;
      const badgeTop = `${Math.round(topBottom + 10)}px`;
      badgeA.style.top = badgeB.style.top = badgeC.style.top = badgeTop;
    }
    window.addEventListener('resize', resize);

    resetScenario('hit');
    setViewMode('triptych');
    setInspectPreset('C');
    resize();

    let acc = 0;
    let lastReal = Date.now();
    function loop() {
      const nowReal = Date.now();
      const real = Math.min(0.05, (nowReal - lastReal) / 1000);
      lastReal = nowReal;
      if (!labState.paused) {
        acc += real;
        const sc = SCENARIOS[labState.scenarioId];
        while (acc >= DT) {
          if (labState.simTime >= sc.length) {
            resetScenario(labState.scenarioId);
          } else {
            stepSimulation(DT);
          }
          acc -= DT;
        }
      }
      renderFrame();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    window.artCombatLab = {
      PRESET_REVISION,
      PRESETS,
      SCENARIOS,
      setViewMode,
      setScenario,
      seek,
      setPaused,
      replay: () => setScenario(labState.scenarioId, { autoPlay: true }),
      setCameraDist: (d) => {
        labState.camDist = d;
        document.getElementById('camSel').value = String(d);
      },
      getState: () => ({
        viewMode: labState.viewMode,
        scenarioId: labState.scenarioId,
        simTime: labState.simTime,
        paused: labState.paused,
        camDist: labState.camDist,
        knightClip: knightView?.currentName,
        ninjaClip: ninjaView?.currentName,
        knightHp: knight?.hp,
        ninjaHp: ninja?.hp
      })
    };
  </script>
</body>
</html>
